name: Format Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  format:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup GDScript Formatter
        uses: Modern-Arts-Research-Stories-Next/setup-gdscript-formatter@v1
        with:
          version: 0.21.0
          cache: true

      - name: Verify version
        run: gdscript-formatter --version
