name: Godot Component Library CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.0"
          use-dotnet: false

      - name: Verify Headless Import
        run: godot --headless --editor --quit

      # Fallback check: create test directory if it doesn't exist yet
      - name: Ensure Test Directory Exists
        run: mkdir -p res://test

      - name: Execute GdUnit4 Tests
        uses: godot-gdunit-labs/gdUnit4-action@v1.1.1
        with:
          godot-version: "4.7.0"
          paths: "res://test"
          timeout: 5