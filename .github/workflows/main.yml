name: Godot Component Library CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0" # Changed 'godot-version' to 'version'
          use-dotnet: false

      - name: Verify Headless Import
        run: godot --headless --editor --quit

  run-tests:
    needs: validate-project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Execute GdUnit4 Tests
        uses: godot-gdunit-labs/gdUnit4-action@v1.1.1
        with:
          godot-version: "4.3.0"
          paths: "res://test"
          timeout: 5